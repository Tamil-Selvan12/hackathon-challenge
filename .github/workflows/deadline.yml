name: 30-Minute Competition Timer

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  check-timer:
    runs-on: ubuntu-latest
    steps:
      - name: Validate submission window
        run: |
          # 1. Set the fixed cutoff time (Exact date and time + 30 minutes from start)
          # Example: 11:37 PM IST on October 9, 2026
          DEADLINE=$(date -d "2026-10-09 23:37:00 +0530" +%s)
          CURRENT_TIME=$(date +%s)

          echo "Submitted at: $(date)"
          echo "Deadline was: 2026-10-09 23:37:00 IST"

          # 2. Check if current time has passed the deadline
          if [ $CURRENT_TIME -gt $DEADLINE ]; then
            echo "❌ TIME EXPIRED: This submission was made after the 30-minute limit."
            exit 1
          else
            echo "✅ ON TIME: Submission accepted within the 30-minute window."
          fi
